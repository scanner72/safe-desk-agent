name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m safe_desk analyze examples/btc-ohlcv.csv --symbol BTCUSDT
      - run: python -m safe_desk size --equity 1000 --entry 102450 --stop 100200
      - run: python -m safe_desk ticket --symbol BTCUSDT --side BUY --equity 1000 --entry 102450 --stop 100200 --tp 106950
